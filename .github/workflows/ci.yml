name: CI
on: [push, pull_request]
jobs:
  install-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [pricor, rator, fetchor, resolvor, trendor, extractor, snappor, weathor, locator, stockor]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ${{ matrix.service }}
        run: npm ci --omit=dev
        working-directory: services/${{ matrix.service }}

  install-check-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install demo agent
        run: npm ci
        working-directory: agents/demo
