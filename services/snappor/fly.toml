app = 'snappor-x402'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '30s'
    timeout = '15s'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[[restart]]
  policy = 'always'
  max_retries = 10

[env]
  PAY_TO = "0x7754DfCEBaA2E5c562aA42c67C5A6E7EDF5b5b81"
  PRICE = "$0.008"
  CHROME_PATH = "/usr/bin/chromium"
